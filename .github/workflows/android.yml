name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.6.2"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache do Godot e dos modelos de exportação
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Baixar Godot ${{ env.GODOT_VERSION }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf templates *.zip *.tpz

      - name: Configurar Android SDK e chave
        run: |
          ~/godot/godot --headless --editor --path . --quit || true
          F=$(ls ~/.config/godot/editor_settings-*.tres | head -1)
          echo "Configurações: $F"
          sed -i '/export\/android\/android_sdk_path/d;/export\/android\/java_sdk_path/d' "$F"
          echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\"" >> "$F"
          echo "export/android/java_sdk_path = \"$JAVA_HOME\"" >> "$F"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $HOME/release.keystore
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/release.keystore" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=${{ secrets.KEYSTORE_USER }}" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "RELEASE_BUILD=1" >> $GITHUB_ENV
          fi
          ls ~/.local/share/godot/keystores || true

      - name: Silhuetas das folhas novas (calcular no celular trava o jogo)
        run: |
          python3 -c "import PIL" 2>/dev/null || pip3 install --quiet pillow || true
          python3 tools/make_sil.py || true

      - name: Importar recursos
        run: ~/godot/godot --headless --path . --import || true

      - name: Teste automático (Fase 1 do começo ao fim)
        run: ~/godot/godot --headless --path . -s tests/route.gd

      - name: Teste automático (Episódio 2 do começo ao fim)
        run: ~/godot/godot --headless --path . -s tests/route2.gd

      - name: Teste automático (Epílogo do Episódio 2 — a fuga da Isis)
        run: ~/godot/godot --headless --path . -s tests/isis_test.gd

      - name: Teste dos controles de toque (diagonal e analógico)
        run: ~/godot/godot --headless --path . -s tests/touch.gd | tee /tmp/touch.log && grep -q "TOUCH OK" /tmp/touch.log

      - name: Teste de salvar e continuar (segredos, chefe, picareta)
        run: ~/godot/godot --headless --path . -s tests/save_test.gd | tee /tmp/save.log && grep -q "SAVE OK" /tmp/save.log

      - name: Gerar APK
        run: |
          mkdir -p build
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"0.1.${{ github.run_number }}\"/" export_presets.cfg
          if [ "$RELEASE_BUILD" = "1" ]; then MODE=--export-release; else MODE=--export-debug; fi
          ~/godot/godot --headless --path . $MODE "Android" build/encontre-a.apk
          # versão de teste: outro app no celular (instala ao lado do normal) com todos os episódios liberados
          cp export_presets.cfg /tmp/presets_normal.cfg
          sed -i 's/^custom_features=.*/custom_features="teste"/' export_presets.cfg
          sed -i 's/^package\/unique_name=.*/package\/unique_name="com.alanclebersantana.findher.teste"/' export_presets.cfg
          sed -i 's/^package\/name=.*/package\/name="Encontre-a (teste)"/' export_presets.cfg
          ~/godot/godot --headless --path . $MODE "Android" build/encontre-a-teste.apk
          cp /tmp/presets_normal.cfg export_presets.cfg
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: encontre-a-apk
          path: |
            build/encontre-a.apk
            build/encontre-a-teste.apk

      - name: Publicar na página de versões (para baixar no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Encontre-a 0.1.${{ github.run_number }}
          body: |
            APKs gerados automaticamente:
            - **encontre-a.apk**: o jogo normal (cada episódio abre depois de terminar o anterior).
            - **encontre-a-teste.apk**: versão de teste, com todos os episódios liberados. Instala como
              outro app ("Encontre-a (teste)"), ao lado do normal, com progresso separado.
            No celular: baixe o arquivo e toque nele para instalar
            (pode ser preciso permitir "instalar apps desconhecidos" para o navegador).
          files: |
            build/encontre-a.apk
            build/encontre-a-teste.apk
          prerelease: true
